<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6ff"><title>XP NEXT · Life is the game</title>
<style>
:root{font-family:Inter,ui-rounded,"SF Pro Display",system-ui,sans-serif;color:#292642;background:#f7f6ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid #eae7f4;padding:28px 18px;display:flex;flex-direction:column;gap:10px}.brand{font-size:30px;font-weight:950;letter-spacing:-2px;padding:10px 14px;color:#7155dc}.nav{border:0;text-align:left;background:transparent;padding:14px 16px;border-radius:15px;font-weight:750;color:#77708d}.nav.active{color:#684de0;background:#efebff}.sidebottom{margin-top:auto;background:#f5f1ff;border-radius:18px;padding:14px}.main{max-width:1220px;width:100%;margin:auto;padding:32px 38px 90px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 25px}.kicker{font-size:11px;font-weight:900;color:#877ba2;letter-spacing:1.8px}h1{font-size:clamp(27px,4vw,39px);letter-spacing:-1.5px;margin:7px 0}h2{font-size:20px;letter-spacing:-.5px}h3{margin:0 0 9px}p{line-height:1.5}.muted{color:#827d96}.card{background:#fff;border:1px solid #eeecf5;border-radius:24px;padding:23px;box-shadow:0 9px 30px #29204808}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(270px,1fr);gap:19px}.stack{display:grid;gap:19px}.hero{background:linear-gradient(130deg,#7960ec,#a78bfa);padding:31px;border-radius:27px;display:flex;justify-content:space-between;align-items:center;color:white;min-height:240px;box-shadow:0 15px 26px #7c68ec2b}.hero h2{font-size:32px;line-height:1.1;margin:10px 0}.hero p{color:#eee7ff}.mascot{font-size:95px;filter:drop-shadow(0 13px 5px #5748ae33);transform:rotate(-8deg)}.btn{background:#7960ee;border:0;border-bottom:4px solid #5d43ce;color:#fff;border-radius:14px;padding:11px 16px;font-weight:900}.btn:hover{filter:brightness(1.04)}.btn.orange{background:#ffad50;border-color:#e88929;color:#653810}.btn.ghost{background:#f3f1fb;border-color:#e3dfed;color:#584b81}.btn.sm{padding:8px 12px;font-size:13px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.space{margin:24px 0 13px}.task{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid #f0edf6}.task:last-child{border-bottom:0}.task.done .taskname{text-decoration:line-through;color:#aaa}.check{border:2px solid #bdb4e9;background:white;width:31px;height:31px;border-radius:11px;color:white;font-weight:900;flex-shrink:0}.check.done{background:#43cbb0;border-color:#43cbb0}.taskbody{min-width:0;flex:1}.taskname{font-weight:790;overflow-wrap:anywhere}.sub{font-size:12px;color:#8c859a;margin-top:4px}.chip{background:#f4f2fb;border:0;padding:9px 12px;border-radius:20px;color:#685b84;font-weight:750}.chip.on{background:#e5ddff;color:#684bd5}.progress{height:13px;background:#eeeaf9;border-radius:30px;overflow:hidden;margin:12px 0}.fill{height:100%;border-radius:30px;background:linear-gradient(90deg,#826df4,#40c9b3)}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:5px;margin-top:19px}.stats b{font-size:25px;color:#6e57dd}.stats span{display:block;font-size:11px;color:#827d96}.project{display:block;width:100%;text-align:left;border:1px solid #ece9f5;background:#fff;border-radius:20px;padding:18px}.project p{font-size:13px;color:#898198}.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.modalback{position:fixed;inset:0;background:#1c123e88;display:grid;place-items:center;padding:15px;z-index:10}.dialog{background:white;border-radius:25px;padding:25px;width:min(95vw,500px);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #21114455}label{display:grid;gap:7px;font-size:13px;font-weight:800;margin:13px 0}input,select{width:100%;padding:12px;border-radius:13px;border:1px solid #ddd7ec;color:#27213f;background:white}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.welcome{text-align:center;padding:40px}.welcome .mascot{font-size:95px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#28213e;color:white;border-radius:15px;padding:13px 20px;box-shadow:0 10px 35px #30244838;display:none;z-index:30}.center{text-align:center}.empty{padding:25px;color:#8c859a;text-align:center}.bars{display:flex;align-items:flex-end;gap:8px;height:105px}.bar{flex:1;background:#8a73ef;border-radius:9px 9px 4px 4px;min-height:3px}.barlabel{font-size:11px;color:#a099b6;text-align:center}.barcol{flex:1}.badge{background:#f4ecff;color:#7454ca;font-size:12px;padding:6px 10px;border-radius:20px;font-weight:800}.socialitem{padding:12px 0;border-bottom:1px solid #eeebf5}.close{background:transparent;border:0;font-size:23px;color:#827d96}.footnav{display:none}@media(max-width:800px){.layout{display:block}.sidebar{display:none}.main{padding:22px 18px 95px}.grid{grid-template-columns:1fr}.hero{min-height:200px;padding:24px}.hero h2{font-size:27px}.mascot{font-size:75px}.footnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ebe8f4;justify-content:space-around;padding:8px 5px env(safe-area-inset-bottom);z-index:5}.footnav button{background:none;border:0;font-size:12px;color:#817794;padding:8px 5px}.footnav button.active{color:#7859e2;font-weight:900}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>
(()=>{
'use strict';
const KEY='xp-next-web-v1',SB='https://ugoaqdsnizudjifghtoz.supabase.co',PUB='sb_publishable_kKvKmCNfNegimCjV9dz1JA_d5L6LKx9';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(),date=()=>new Date().toISOString().slice(0,10);
const fresh=()=>({name:'Adventurer',avatar:'🦊',xp:0,coins:0,tasks:[],projects:[],events:[],minutes:30,energy:'steady'});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}
if(!Array.isArray(data.tasks)||!Array.isArray(data.projects)||!Array.isArray(data.events))data=fresh();
let page='today',selected='',modal='',token=null,user=null,sessionInfo=null,seconds=0,ticker=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const lvl=()=>Math.floor(Math.sqrt(Math.max(0,data.xp)/70))+1;
const reward=t=>Math.min(75,10+Math.ceil((+t.minutes||15)/10)*5+(+t.priority===3?10:0));
const toast=s=>{const n=$('#toast');n.textContent=s;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display='none',2800)};
const go=p=>{page=p;selected='';modal='';draw();window.scrollTo(0,0)};
const tabs=[['today','☀️','Today'],['projects','🧩','Projects'],['paths','🪐','Paths'],['social','🤝','Friends'],['you','🦊','You']];
const nav=()=>tabs.map(([p,i,n])=>`<button class="nav ${page===p?'active':''}" data-go="${p}">${i} &nbsp; ${n}</button>`).join('');
const levels=()=>`<div class="progress"><div class="fill" style="width:${(data.xp%140)/140*100}%"></div></div>`;
const head=(title,kicker,action='')=>`<header class="head"><div><div class="kicker">${kicker}</div><h1>${title}</h1></div><div class="row"><span class="badge">🪙 ${data.coins}</span><span class="badge">⚡ Lv ${lvl()}</span>${action}</div></header>`;
const shell=content=>`<div class="layout"><aside class="sidebar"><div class="brand">XP ✦</div>${nav()}<div class="sidebottom">🦊 Real life is the game.<br><small class="muted">Every small win counts.</small></div></aside><main class="main">${content}</main></div><nav class="footnav">${tabs.map(([p,i,n])=>`<button data-go="${p}" class="${page===p?'active':''}">${i}<br>${n}</button>`).join('')}</nav>`;
const quests=list=>list.length?list.map(t=>`<div class="task ${t.done?'done':''}"><button class="check ${t.done?'done':''}" data-complete="${t.id}" aria-label="Toggle completion">${t.done?'✓':''}</button><div class="taskbody"><div class="taskname">${esc(t.title)}</div><div class="sub">${esc(t.category||'✨ Life')} · ${t.minutes||15} min ${t.due?' · 📅 '+esc(t.due):''}</div></div><span class="badge">+${reward(t)} XP</span><button class="btn ghost sm" data-play="${t.id}">▶</button><button class="close" title="Delete quest" data-del="${t.id}">×</button></div>`).join(''):'<div class="empty">No quests here. Start something brilliant! ✨</div>';
const projectTile=p=>{const tasks=data.tasks.filter(t=>t.projectId===p.id);const done=tasks.filter(t=>t.done).length;return `<button class="project" data-project="${p.id}"><div style="font-size:35px">${esc(p.icon||'🚀')}</div><h3>${esc(p.title)}</h3><p>${done}/${tasks.length} quests completed</p><div class="progress"><div class="fill" style="width:${tasks.length?done/tasks.length*100:0}%"></div></div></button>`};
const rec=()=>data.tasks.filter(t=>!t.done).sort((a,b)=>{const score=t=>(t.due&&t.due<=date()?100:0)+(+t.priority||1)*25+(+t.minutes<=data.minutes?20:-10);return score(b)-score(a)})[0];
function today(){const open=data.tasks.filter(t=>!t.done),r=rec(),done=data.tasks.filter(t=>t.done).length;return head('Hey, '+esc(data.name)+'! 👋','YOUR ADVENTURE STARTS HERE','<button class="btn sm" data-modal="task">+ Quest</button>')+`<div class="grid"><div class="stack"><section class="hero"><div><div class="kicker" style="color:#eee6ff">✨ YOUR NEXT CHAPTER</div><h2>Little steps.<br>Legendary progress.</h2><p>Make today count, one quest at a time.</p><button class="btn orange" ${r?'data-play="'+r.id+'"':'data-modal="task"'}>${r?'Start a mission →':'Create your first quest →'}</button></div><div class="mascot">${esc(data.avatar)}</div></section><div class="card"><div class="row between"><h2>🎯 Your quests</h2><button class="btn ghost sm" data-modal="task">+ Add</button></div>${quests(open)}${data.tasks.some(t=>t.done)?'<h3 class="space">🌟 Recent wins</h3>'+quests(data.tasks.filter(t=>t.done).slice(-3).reverse()):''}</div><div class="row between"><h2>🧩 Your projects</h2><button class="btn ghost sm" data-go="projects">See all</button></div><div class="projects">${data.projects.slice(0,2).map(projectTile).join('')||'<div class="card">Your first project is one click away.</div>'}</div></div><div class="stack"><div class="card"><div class="row between"><h3>⚡ Your power</h3><span class="badge">Level ${lvl()}</span></div>${levels()}<p class="muted">Personal, self-reported progress.</p><div class="stats"><div><b>${done}</b><span>Quests done</span></div><div><b>${data.tasks.length?Math.round(100*done/data.tasks.length):0}%</b><span>Completion</span></div><div><b>${data.xp}</b><span>Total XP</span></div></div></div><div class="card"><div class="kicker">🌟 SMART PICK</div><h2>${esc(r?.title||'Your adventure awaits')}</h2><p class="muted">${r?'Try this next. '+(r.due&&r.due<=date()?'It is due now. ':'')+'It is one of your highest-priority quests.':'Add a task and XP will help you pick a next step.'}</p><div class="row" style="flex-wrap:wrap">${[15,30,60].map(m=>`<button class="chip ${data.minutes===m?'on':''}" data-time="${m}">${m} min</button>`).join('')}</div><div class="row" style="margin-top:10px;flex-wrap:wrap">${['gentle','steady','bold'].map(e=>`<button class="chip ${data.energy===e?'on':''}" data-energy="${e}">${e}</button>`).join('')}</div>${r?'<button class="btn orange" style="margin-top:19px" data-play="'+r.id+'">Let\'s go →</button>':''}</div><div class="card"><h3>💜 No broken streaks</h3><p class="muted">We celebrate progress, not perfect attendance. Your journey is yours.</p></div></div></div>`}
function projects(){const p=data.projects.find(x=>x.id===selected);if(p)return head(esc(p.title),'YOUR PROJECT','<button class="btn sm" data-modal="task">+ Quest</button>')+`<button class="btn ghost sm" data-back="1">← All projects</button><div class="card space"><h2>${esc(p.icon)} ${esc(p.title)}</h2><p class="muted">${esc(p.description||'A collection of meaningful wins.')}</p>${quests(data.tasks.filter(t=>t.projectId===p.id))}</div>`;return head('Projects 🧩','BIG GOALS, LITTLE WINS','<button class="btn sm" data-modal="project">+ Project</button>')+`<div class="hero"><div><h2>Build something awesome.</h2><p>Turn a big dream into a series of small adventures.</p><button class="btn orange" data-modal="project">Begin →</button></div><div class="mascot">🚀</div></div><div class="projects space">${data.projects.map(projectTile).join('')}</div>`}
function paths(){let cats=['📚 Learning','💪 Fitness','🎨 Creativity','💻 Work','💖 Life','🌎 Adventure'];return head('Your paths 🪐','GROW INTO YOUR NEXT SELF')+`<div class="card"><h2>Every quest builds your story.</h2><p class="muted">Your completed quests, grouped into the skills and interests you actually work on.</p><div class="projects">${cats.map(c=>{let ts=data.tasks.filter(t=>t.category===c),done=ts.filter(t=>t.done).length;return `<div class="project"><h3>${c}</h3><p>${done} victories · ${ts.length} quests</p><div class="progress"><div class="fill" style="width:${ts.length?done/ts.length*100:0}%"></div></div></div>`}).join('')}</div></div>`}
function you(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)});let vals=days.map(d=>data.events.filter(e=>e.date===d).length),max=Math.max(1,...vals);return head('Your legend ✨','YOU ARE THE MAIN CHARACTER')+`<div class="grid"><div class="stack"><div class="hero"><div><h2>${esc(data.name)}</h2><p>Level ${lvl()} · ${data.xp} XP · ${data.coins} coins</p><button class="btn orange" data-modal="avatar">Customize character</button></div><div class="mascot">${esc(data.avatar)}</div></div><div class="card"><h2>🏆 Accomplishment archive</h2>${data.events.length?data.events.slice(-10).reverse().map(e=>`<div class="socialitem">🌟 ${esc(e.title)} <small class="muted">${esc(e.date)}</small></div>`).join(''):'<p class="muted">Your first completed quest becomes your first trophy.</p>'}</div></div><div class="stack"><div class="card"><h2>📊 The past 7 days</h2><div class="bars">${vals.map((v,i)=>`<div class="barcol"><div class="bar" style="height:${Math.max(4,v/max*100)}px"></div><div class="barlabel">${days[i].slice(5)}</div></div>`).join('')}</div><p class="muted">Completed quests per day</p></div><div class="card"><h2>Save your journey</h2><button class="btn ghost" data-export="1">Download backup</button><p class="muted">Solo work is stored on this browser, not automatically synced between devices.</p></div></div></div>`}
async function api(path,method='GET',body=null){if(!token)throw Error('Sign in first');const r=await fetch(SB+path,{method,headers:{apikey:PUB,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=representation'},body:body?JSON.stringify(body):null});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.message||j.error_description||j.error||'Network request failed')};const t=await r.text();return t?JSON.parse(t):null}
async function authSubmit(f){const email=f.email.value,password=f.password.value,mode=f.dataset.mode;const url=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const r=await fetch(SB+url,{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||'Could not sign in');if(!d.access_token){toast('Check your email to confirm your account ✉️');modal='';draw();return}token=d.access_token;user=d.user;sessionInfo={...d,expires_at:Date.now()+d.expires_in*1000};localStorage.setItem('xp-web-auth',JSON.stringify(sessionInfo));modal='';draw();toast('Welcome to the crew! 🎉')}
async function socialLoad(){if(!user)return;try{let fs=await api('/rest/v1/xp_friendships?select=*&or=(requester_id.eq.'+user.id+',addressee_id.eq.'+user.id+')');let ids=[...new Set(fs.flatMap(x=>[x.requester_id,x.addressee_id]).filter(x=>x!==user.id))];let ps=ids.length?await api('/rest/v1/xp_profiles?select=id,username,avatar&id=in.('+ids.join(',')+')'):[];const target=$('#socialdata');if(!target)return;target.innerHTML=fs.length?fs.map(x=>{let p=ps.find(z=>z.id===(x.requester_id===user.id?x.addressee_id:x.requester_id));return `<div class="socialitem">👤 ${esc(p?.username||'Player')} · ${esc(x.status)} ${x.status==='pending'&&x.addressee_id===user.id?'<button class="btn sm" data-accept="'+x.id+'">Accept</button>':''}</div>`}).join(''):'<p class="muted">Your next teammate is out there.</p>'}catch(e){toast(e.message)}}
function social(){return head('The crew 🤝','REAL PROJECTS, REAL FRIENDS')+(user?`<div class="grid"><div class="card"><h2>🔎 Find your friends</h2><form id="findForm"><label>Search player username<input name="query" minlength="2" placeholder="Their username" required></label><button class="btn">Search players</button></form><div id="findresults"></div></div><div class="card"><h2>💌 Friends & requests</h2><div id="socialdata"><p class="muted">Loading social adventures…</p></div></div></div>`:`<div class="card center"><div style="font-size:55px">🤝</div><h2>Adventures are better together.</h2><p class="muted">Create an account to find friends and send invitations.</p><button class="btn" data-modal="auth">Sign in / sign up</button></div>`)}
function overlay(){if(!modal)return'';let body='';if(modal==='task')body=`<h2>✨ New quest</h2><p class="muted">One real thing you want to accomplish.</p><form id="questForm"><label>What are we doing?<input name="title" maxlength="160" placeholder="e.g. Finish my presentation" required autofocus></label><label>Life path<select name="category">${['📚 Learning','💪 Fitness','🎨 Creativity','💻 Work','💖 Life','🌎 Adventure'].map(c=>'<option>'+c+'</option>').join('')}</select></label><label>Estimated minutes<input name="minutes" type="number" min="5" max="600" value="25"></label><label>Due date (optional)<input type="date" name="due"></label><label>Priority<select name="priority"><option value="1">Normal</option><option value="2">Important</option><option value="3">Urgent</option></select></label><label>Project<select name="project"><option value="">No project</option>${data.projects.map(p=>'<option value="'+p.id+'" '+(selected===p.id?'selected':'')+'>'+esc(p.title)+'</option>').join('')}</select></label><div class="actions"><button type="button" class="btn ghost" data-close="1">Cancel</button><button class="btn">Add quest ✨</button></div></form>`;
if(modal==='project')body=`<h2>🚀 New project</h2><form id="projectForm"><label>Project name<input name="title" maxlength="120" required placeholder="Build a portfolio"></label><label>Description<input name="description" maxlength="350" placeholder="What makes this worth doing?"></label><label>Icon<select name="icon"><option>🚀</option><option>🧩</option><option>🎨</option><option>📚</option><option>🌱</option><option>💻</option></select></label><div class="actions"><button type="button" class="btn ghost" data-close="1">Cancel</button><button class="btn">Create project</button></div></form>`;
if(modal==='avatar')body=`<h2>🎨 Your character</h2><p class="muted">Choose a look for your real-life hero.</p><form id="avatarForm"><label>Name<input name="name" maxlength="30" value="${esc(data.name)}" required></label><label>Avatar<select name="avatar">${['🦊','🐻','🐱','🐼','🐸','🦄','🐉','👩‍🚀','🧙','🦖'].map(a=>'<option '+(a===data.avatar?'selected':'')+'>'+a+'</option>').join('')}</select></label><div class="actions"><button type="button" class="btn ghost" data-close="1">Cancel</button><button class="btn">Save character</button></div></form>`;
if(modal==='auth')body=`<h2>🤝 Join the crew</h2><p class="muted">XP uses Supabase authentication. You may need to verify your email.</p><form id="authForm" data-mode="login"><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" minlength="6" name="password" autocomplete="current-password" required></label><div class="actions"><button type="button" class="btn ghost" data-mode="signup">Sign up</button><button class="btn">Sign in</button></div></form><button class="btn ghost" style="margin-top:12px" data-close="1">Cancel</button>`;
if(modal==='mission'){const t=data.tasks.find(t=>t.id===selected);body=`<div class="center"><div style="font-size:60px">⚔️</div><div class="kicker">YOUR REAL-WORLD MISSION</div><h2>${esc(t?.title||'Your quest')}</h2><p class="muted">Put down your phone and do the thing. Come back when you're ready!</p><h1 id="timer"> ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}</h1><div class="row" style="justify-content:center"><button class="btn ghost" data-timer="1">${ticker?'Pause':'Start focus timer'}</button><button class="btn orange" data-finish="${selected}">Mission complete ✓</button></div><p class="muted">+ ${reward(t||{})} personal XP. Completion is self-reported.</p><button class="btn ghost space" data-close="1">Back to dashboard</button></div>`}
return `<div class="modalback"><div class="dialog">${body}</div></div>`}
function draw(){let content=page==='today'?today():page==='projects'?projects():page==='paths'?paths():page==='social'?social():you();$('#app').innerHTML=shell(content)+overlay();if(page==='social'&&user)queueMicrotask(socialLoad)}
function finish(id){let t=data.tasks.find(t=>t.id===id);if(!t||t.done)return;if(ticker){clearInterval(ticker);ticker=null}t.done=true;t.completedAt=Date.now();const x=reward(t);data.xp+=x;data.coins+=Math.ceil(x/6);data.events.push({id:uid(),taskId:t.id,title:t.title,date:date(),xp:x});save();modal='';draw();toast('🎉 QUEST COMPLETE! +'+x+' XP!')}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;try{
if(d.go)return go(d.go);
if(d.modal){modal=d.modal;draw();return}
if(d.close){modal='';if(ticker){clearInterval(ticker);ticker=null}draw();return}
if(d.back){selected='';draw();return}
if(d.project){selected=d.project;draw();return}
if(d.time){data.minutes=+d.time;save();draw();return}
if(d.energy){data.energy=d.energy;save();draw();return}
if(d.play){selected=d.play;seconds=(+data.tasks.find(t=>t.id===selected)?.minutes||15)*60;modal='mission';draw();return}
if(d.timer){if(ticker){clearInterval(ticker);ticker=null;draw()}else{ticker=setInterval(()=>{seconds=Math.max(0,seconds-1);const n=$('#timer');if(n)n.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(!seconds){clearInterval(ticker);ticker=null;toast('Focus time finished! 🎯')}},1000);draw()}return}
if(d.finish)return finish(d.finish);
if(d.complete){const t=data.tasks.find(t=>t.id===d.complete);if(t?.done){t.done=false;data.xp=Math.max(0,data.xp-reward(t));data.coins=Math.max(0,data.coins-Math.ceil(reward(t)/6));data.events=data.events.filter(x=>x.taskId!==t.id);save();draw()}else finish(d.complete);return}
if(d.del){if(confirm('Remove this quest?')){data.tasks=data.tasks.filter(t=>t.id!==d.del);save();draw()}return}
if(d.export){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='xp-next-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);return}
if(d.mode){$('#authForm').dataset.mode=d.mode;const btn=$('#authForm button[type=submit],#authForm button:not([type])');if(btn)btn.textContent='Create account';return}
if(d.accept){await api('/rest/v1/xp_friendships?id=eq.'+encodeURIComponent(d.accept),'PATCH',{status:'accepted'});toast('Friend added! 💌');socialLoad();return}
if(d.friend){await api('/rest/v1/xp_friendships','POST',{requester_id:user.id,addressee_id:d.friend,status:'pending'});toast('Friend request sent!');socialLoad();return}
}catch(x){toast(x.message)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;const fd=new FormData(f);try{
if(f.id==='questForm'){data.tasks.unshift({id:uid(),title:String(fd.get('title')).trim().slice(0,160),category:fd.get('category'),minutes:Math.max(5,Math.min(600,+fd.get('minutes')||25)),priority:+fd.get('priority')||1,due:fd.get('due')||'',projectId:fd.get('project')||'',done:false});modal='';save();draw();toast('New quest unlocked! 🌟')}
if(f.id==='projectForm'){data.projects.push({id:uid(),title:String(fd.get('title')).trim().slice(0,120),description:String(fd.get('description')||''),icon:fd.get('icon')});modal='';save();go('projects');toast('New adventure created! 🚀')}
if(f.id==='avatarForm'){data.name=String(fd.get('name')).trim().slice(0,30);data.avatar=fd.get('avatar');modal='';save();draw();toast('Looking legendary! 🎨')}
if(f.id==='authForm')await authSubmit(f);
if(f.id==='findForm'){let q=String(fd.get('query')).replace(/[^a-zA-Z0-9_]/g,'').slice(0,24);if(q.length<2)throw Error('Search at least two characters');const p=await api('/rest/v1/xp_profiles?select=id,username,avatar&username=ilike.*'+encodeURIComponent(q)+'*&limit=12');$('#findresults').innerHTML=p.filter(x=>x.id!==user.id).map(x=>`<div class="socialitem">${esc(x.avatar)} ${esc(x.username)} <button class="btn sm" data-friend="${x.id}">Add friend</button></div>`).join('')||'<p class="muted">Nobody found yet.</p>'}
}catch(x){toast(x.message)}});
async function resume(){try{const old=JSON.parse(localStorage.getItem('xp-web-auth')||'null');if(old?.access_token&&old.expires_at>Date.now()+60000){token=old.access_token;user=old.user;draw()}else if(old?.refresh_token){const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:old.refresh_token})});if(r.ok){let s=await r.json();token=s.access_token;user=s.user;localStorage.setItem('xp-web-auth',JSON.stringify({...s,expires_at:Date.now()+s.expires_in*1000}));draw()}}}catch{}}
draw();resume();
})();
</script></body></html>
